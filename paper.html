<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Paper Trade</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#262d3a;
    --ink:#e6edf3; --mut:#8b949e; --pos:#2ea043; --neg:#f85149; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  header h1{margin:0 0 4px;font-size:20px}
  .sub{color:var(--mut);font-size:13px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-right:6px;vertical-align:middle}
  .tabs{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13px}
  .tab.active{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:20px;font-weight:600;margin-top:2px}
  h2{font-size:14px;color:var(--mut);margin:22px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;background:var(--panel2)}
  .tbl tr:last-child td{border-bottom:none}
  .tbl td.sym{font-weight:600}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--mut)}
  .tag.crypto{color:#d29922;border-color:#51430f}
  .empty{color:var(--mut);padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .scroll{overflow-x:auto}
  .yes{color:var(--pos);font-weight:600}.no{color:var(--mut)}
  footer{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Strategy Paper Trade</h1>
    <div class="sub" style="margin-bottom:3px">Two forward studies on live data — <b>Box Theory</b> (hybrid) and <b>Candlestick</b> (Type B). Pick a study below; each panel shows that study only.</div>
    <div class="sub"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
  </header>

  <div class="tabs" id="tabs"></div>

  <section>
    <h2 id="stratTitle" style="margin:16px 0 3px;color:var(--ink);font-size:16px;text-transform:none;letter-spacing:0"></h2>
    <div class="sub" id="stratDesc"></div>
    <div class="cards" id="cards"></div>
    <div class="scroll" id="byMarket"></div>
    <div class="sub" id="stratNote" style="margin-top:8px"></div>
  </section>

  <h2>Open positions</h2>
  <div class="scroll" id="open"></div>

  <h2>Closed trades</h2>
  <div class="scroll" id="closed"></div>

  <footer id="foot"></footer>
</div>

<script>
const S = {data:null, strat:"box_theory"};
const $ = s => document.querySelector(s);
const money = v => "$" + Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const num = (v,d=2) => Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const sign = v => (Number(v) >= 0 ? "pos" : "neg");
const R = t => t.net_r !== undefined ? t.net_r : t.net_r_10bps_side;
const REASON_LABELS = {
  stop_intraday:        "stopped out",
  stop_gap:             "stopped out · gap",
  stop_same_bar:        "stopped out · entry bar",
  trail_stop:           "trailing stop",
  red_reference_close:  "red-arrow exit",
  early_failed_breakout:"failed breakout",
  end_of_data:          "open",
};
const REASON_TIPS = {
  stop_intraday:        "Price dropped to the stop level and the position closed there. This says nothing about holding time — a trade can trail for weeks before the stop is finally touched.",
  stop_gap:             "Opened below the stop and closed at the open (gapped straight through the stop).",
  stop_same_bar:        "The stop was touched on the very bar the position was entered.",
  trail_stop:           "Closed at the trailing stop, which had ratcheted up under each new pivot low.",
  red_reference_close:  "Closed on a red exit-signal bar.",
  early_failed_breakout:"The breakout failed back inside the box within the first few bars.",
  end_of_data:          "Still open at the end of the data.",
};
const reason = t => { const r = t.exit_reason || t.reason || ""; return REASON_LABELS[r] || r.replace(/_/g," "); };
const reasonTip = t => { const r = t.exit_reason || t.reason || ""; return REASON_TIPS[r] || ""; };
const mtag = m => `<span class="tag ${m==='crypto'?'crypto':''}">${m}</span>`;

function cards(st){
  const ret = st.return_pct !== undefined ? st.return_pct : (st.pnl_usd / (S.data.equity0||100000) * 100);
  const c = [
    ["Equity", money(st.equity)],
    ["Return", `<span class="${sign(ret)}">${ret>=0?"+":""}${num(ret,1)}%</span>`],
    ["P&L", `<span class="${sign(st.pnl_usd)}">${money(st.pnl_usd)}</span>`],
    ["Win rate", st.trades ? num(st.win_pct,1)+"%" : "—"],
    ["Trades", st.trades],
    ["Avg R / trade", `<span class="${sign(st.avg_r)}">${num(st.avg_r,3)}</span>`],
    ["Recent 2024+", st.recent_trades ? `<span class="${sign(st.recent_avg_r)}">${num(st.recent_avg_r,2)}R</span>` : "—"],
    ["Total R", `<span class="${sign(st.total_r)}">${num(st.total_r,1)}R</span>`],
    ["Max DD", `<span class="neg">${num(st.max_dd_pct,2)}%</span>`],
  ];
  $("#cards").innerHTML = c.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function openTable(rows){
  if(!rows.length){ $("#open").innerHTML = `<div class="empty">No open positions.</div>`; return; }
  const body = rows.map(p=>`<tr>
    <td class="sym">${p.symbol.replace('US.','')}</td>
    <td>${mtag(p.market)}${p.pattern && p.pattern!=='box_theory' ? ' <span class="tag">'+p.pattern.replace('_',' ')+'</span>':''}</td>
    <td>${p.entry_date}</td>
    <td>${num(p.entry)}</td>
    <td>${num(p.active_stop)}</td>
    <td>${p.last_close!=null ? num(p.last_close) : '—'}</td>
    <td class="${sign(p.unrealized_r)}">${num(p.unrealized_r,2)}R</td>
    <td>${p.hit_1r!==undefined ? (p.hit_1r?'<span class="yes">1R</span>':'<span class="no">—</span>') : (p.bars_held!==undefined ? p.bars_held+'d' : '')}</td>
    <td>${p.red_ref!=null ? num(p.red_ref) : (p.if_stopped_now_r!==undefined ? '<span class="'+sign(p.if_stopped_now_r)+'">'+num(p.if_stopped_now_r,2)+'R</span>' : '—')}</td>
  </tr>`).join("");
  $("#open").innerHTML = `<table class="tbl"><thead><tr>
    <th>Symbol</th><th>Market</th><th>Entered</th><th>Entry</th><th>Stop</th><th>Last</th>
    <th>Unrzd R</th><th>1R / held</th><th>Red-ref / if-stop</th></tr></thead><tbody>${body}</tbody></table>`;
}

function closedTable(rows){
  if(!rows.length){ $("#closed").innerHTML = `<div class="empty">No closed trades yet.</div>`; return; }
  const body = rows.map(t=>`<tr>
    <td class="sym">${t.symbol.replace('US.','')}</td>
    <td>${mtag(t.market)}${t.pattern && t.pattern!=='box_theory' ? ' <span class="tag">'+t.pattern.replace('_',' ')+'</span>':''}</td>
    <td>${t.entry_date} → ${t.exit_date}</td>
    <td>${num(t.entry)}</td>
    <td>${num(t.exit)}</td>
    <td class="${sign(R(t))}">${num(R(t),2)}R</td>
    <td class="${sign(t.pnl_usd)}">${money(t.pnl_usd)}</td>
    <td><span class="tag" title="${reasonTip(t)}">${reason(t)}</span></td>
  </tr>`).join("");
  $("#closed").innerHTML = `<table class="tbl"><thead><tr>
    <th>Symbol</th><th>Market</th><th>Held</th><th>Entry</th><th>Exit</th>
    <th>R</th><th>P&amp;L</th><th>Reason</th></tr></thead><tbody>${body}</tbody></table>`;
}

const MKT_NAME = {US:"US equities", crypto:"Crypto", HK:"Hong Kong", JP:"Japan", TW:"Taiwan"};
const MKT_ORDER = ["US","crypto","HK","JP","TW"];
function sigLabel(strat, m){
  if(strat==="box_theory_hybrid") return m==="US" ? "volume-price arrow" : "volume-surge";
  return "candlestick";
}
function byMarketTable(bm, strat){
  const keys = MKT_ORDER.filter(m=>bm[m] && bm[m].trades)
    .concat(Object.keys(bm).filter(m=>!MKT_ORDER.includes(m) && bm[m].trades));
  if(!keys.length){ $("#byMarket").innerHTML = ""; return; }
  const body = keys.map(m=>{
    const s = bm[m];
    return `<tr><td class="sym">${MKT_NAME[m]||m}</td><td>${sigLabel(strat,m)}</td>
      <td>${s.trades}</td><td>${num(s.win_pct,1)}%</td>
      <td class="${sign(s.avg_r)}">${num(s.avg_r,2)}</td>
      <td class="${sign(s.pnl_usd)}">${money(s.pnl_usd)}</td></tr>`;
  }).join("");
  $("#byMarket").innerHTML = `<table class="tbl"><thead><tr>
    <th>Market</th><th>Signal</th><th>Trades</th><th>Win %</th><th>R / trade</th><th>≈ P&amp;L</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}
const META = {
  box_theory_hybrid: {
    title: "Box Theory — hybrid",
    desc: "5 markets, each on its strongest volume signal · 2011–2026 · $100k @ 0.50% risk/trade",
    note: "Each market uses whichever volume signal is strongest there — the volume-price arrow on US equities, a volume-surge rule elsewhere. Net positive in every market over the full history.",
  },
  combined: {
    title: "Candlestick — Type B",
    desc: "Inside / HZG breakout + VRR filter, trailing-pivot-low exit · all markets · 2011–2026 · $100k @ 0.50% risk/trade",
    note: "A profitable pattern study, shown under an unlimited-funds assumption for now — it fires on many symbols at once, so position concurrency is not yet capped. Trade-quality filtering is the next step.",
  },
};
function render(){
  if(!S.data) return;
  const s = S.data.strategies[S.strat];
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.strat===S.strat));
  const m = META[S.strat] || {title:(LABELS[S.strat]||S.strat), desc:"", note:""};
  $("#stratTitle").textContent = m.title;
  $("#stratDesc").textContent = m.desc;
  $("#stratNote").textContent = m.note;
  cards(s.stats);
  byMarketTable(s.by_market||{}, S.strat);
  openTable(s.open||[]);
  closedTable(s.closed||[]);
}

const LABELS = {box_theory_hybrid:"Box Theory · hybrid", combined:"Candlestick · Type B"};
function buildTabs(){
  const keys = Object.keys(S.data.strategies);
  if(!keys.includes(S.strat)) S.strat = keys[0];
  $("#tabs").innerHTML = keys.map(k=>`<button class="tab" data-strat="${k}">${LABELS[k]||k}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{S.strat=b.dataset.strat; render();}));
}

async function load(){
  try{
    const d = await fetch("data/bt_paper.json",{cache:"no-store"}).then(r=>r.json());
    S.data = d;
    const modeLabel = d.mode === "live" ? "Live forward trial" : "Backtest preview";
    $("#status").textContent = `${modeLabel} since ${d.trial_start} · ${money(d.equity0)} @ ${(d.risk_pct*100).toFixed(2)}% risk/trade · updated ${String(d.generated_at).replace('T',' ').slice(0,16)} UTC`;
    $("#foot").innerHTML = `Paper trade — simulated orders on live data, no real capital. <b>Box Theory · hybrid</b> = US equities on the volume-price arrows (via TradingView); crypto, Hong Kong, Japan and Taiwan on the volume-surge signal. <b>Candlestick · Type B</b> = HZG/inside + VRR, trailing-pivot exit. Fixed-fractional ${money(d.equity0)} / ${(d.risk_pct*100).toFixed(2)}%. Historical trades use the original US arrows (where available) and the volume-surge signal on the other markets; new trades appear here as fresh signals fire going forward.`;
    buildTabs();
    render();
  }catch(e){
    $("#dot").style.background="var(--neg)";
    $("#status").textContent = "Could not load bt_paper.json (the nightly run may not have produced it yet).";
  }
}
load();
</script>
</body>
</html>
